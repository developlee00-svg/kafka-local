#==============================================
# Flunet-Bit 서비스의 전역 행동 설정
# 수집 -> 적재(전송) (전처리/추출은 하지 않음)
# logstash 연계가 없었다면 여기에서 기본적인 전처리/필터링 등 작업이 수행될 수 있음(이러면 약간의 지연 발생)
#==============================================
[SERVICE]
    Flush       1       # 수집된 데이터를 출력/전송할 시간 간격 -> 여기선 1초마다 데이터 전송 -> 실시간성 설정
    Log_Level   info    # Fluent-Bit 로그에 대한 레벨 설정. (error, warning, info, debug), info : 일반실행정보, debug까지 출력됨.

#==============================================
# 데이터 수집 Input : 어디에서 데이터를 가져올 것인가
# Input : sensor_json.log
#==============================================
[INPUT]
    Name    tail                                        # 파일의 끝(tail)에서 읽어옴. -> 플러그인
    Path    /opt/airflow/sensor_logs/sensor_json.log    # 읽어올 로그 파일 경로 -> 날짜가 바뀌면? 파일이 커지면? -> 해결해야함.
    Tag     sensor.json                                 # 해당 데이터에 Tag를 표시하여 [OUTPUT]에서 태그를 보고 어디로 전송할지 필터링할 수 있게 함.
    Parser  json                                        # 파일 내용을 미리 정의된 json 파서를 활용하여 구조화된 데이터로 인삭하게 함.
#==============================================
# Input : sensor_text.log
#==============================================
[INPUT]
    Name    tail                                        
    Path    /opt/airflow/sensor_logs/sensor_text.log    
    Tag     sensor.text                                 
#==============================================
# 데이터 배포 Output : 데이터를 어디로 보낼 것인가
# Output : Kafka
#==============================================
[OUTPUT]
    # Kafka 출력 플러그인
    Name    kafka
    # tag가 sensor.json인 데이터만 출력 설정 : 필터링 기능
    Match   sensor.json
    # 전송할 곳 엔드포인트 (kafka의 broker 주소)
    # (도커 컴포즈 구성 시 서비스명):포트 -> AWS MSK의 엔드포인트로 교체
    Brokers kafka:9092
    # 데이터를 카프카로 보낼 때 -> 토픽명 필요
    Topics factory-json-topic
    # 전송되는 데이터의 형식 -> JSON 형태 유지
    Format json

#==============================================
# Output : LogStash (http로 전송)
#==============================================
[OUTPUT]
